<article class="panel map-panel">
  <div class="panel-head">
    <div><h2 id="map-detail-name">当前地图</h2><p id="map-caption">正在读取地图</p></div>
    <div class="actions">
      <button id="zoom-out" aria-label="缩小地图">−</button><button id="zoom-in" aria-label="放大地图">＋</button>
      <a id="edit-current-map" class="button primary" hidden>开启编辑</a>
    </div>
  </div>
  <div class="canvas-wrap"><canvas id="map-canvas" aria-label="地图"></canvas><div id="map-tip" hidden></div></div>
  <div class="map-foot"><span id="map-scale"></span></div>
</article>
