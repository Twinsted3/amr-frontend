<article class="panel">
  <div class="panel-head"><div><h2 id="vehicle-record-name">正在读取车辆</h2><p id="vehicle-record-address"></p></div><div class="actions"><span class="badge">历史样本</span><span id="vehicle-record-status" class="badge"></span><button id="vehicle-record-connection" type="button" class="primary" disabled>连接</button><button id="vehicle-record-remove" type="button" disabled>移除登记</button></div></div>

  <div class="panel-body ruled">
    <label>连接方式<select id="vehicle-connect-mode"><option value="sample_tcp">历史数据模拟（每秒一条）</option><option value="fork_sample_tcp">货叉升降模拟（每秒一条）</option></select></label>
    <p>两种模拟均通过本机 TCP 循环发送历史报文。切换连接方式前请先断开。</p>
  </div>

  <div id="vehicle-remove-confirm" class="panel-body ruled actions" hidden>
    <span>移除后会断开该车辆的车况连接。</span>
    <button id="vehicle-remove-submit" type="button" data-vehicle-command="remove">确认移除</button>
    <button id="vehicle-remove-cancel" type="button">取消移除</button>
  </div>
  <div id="vehicle-status-body" class="panel-body"></div>
</article>
