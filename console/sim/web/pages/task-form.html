<article class="panel">
      <div class="panel-head"><div><h2>任务参数</h2><p id="fleet-task-map">任务使用当前车队已加载的运行地图。</p></div></div>
      <form id="fleet-task" class="panel-body stack">
        <div class="form-line">
          <label>任务编号<input id="fleet-job-id" maxlength="120" required></label>
          <label>任务类型<select id="fleet-kind"><option value="transport">搬运</option><option value="move">移动后返程</option><option value="standby">到站待命</option><option value="charge">充电</option></select></label>
          <label id="fleet-priority-field">优先级<select id="fleet-priority"><option value="100">高</option><option value="0" selected>中</option><option value="-100">低</option></select></label>
        </div>
        <div class="form-line">
          <label id="fleet-pickup-field">取货站点<select id="fleet-pickup" required></select></label>
          <label id="fleet-target-field">卸货站点 / 目标<select id="fleet-target" required></select></label>
          <label id="fleet-charge-vehicle-field" hidden>叉车<select id="fleet-charge-vehicle" required disabled><option value="">请选择叉车</option></select></label>
          <label id="fleet-charge-point-field" hidden>充电点位<select id="fleet-charge-point" disabled><option value="">自动选择最近可用桩</option></select></label>
          <button type="submit" id="fleet-submit" class="primary" disabled>提交车队任务</button>
        </div>
        <p id="fleet-charge-note" hidden>车辆先完成当前任务。指定桩被占用时，充电单会排队等待该桩腾空。</p>
      </form>
      <details class="panel-body ruled">
        <summary>批量任务</summary>
        <div class="actions fleet-batch-actions"><button id="fleet-out" type="button" disabled>填入五车短程待命</button><button id="fleet-home" type="button" disabled>填入五车回停靠点</button></div>
        <label>任务 JSON（最多 100 项）<textarea id="fleet-batch" rows="6" spellcheck="false"></textarea></label>
        <button id="fleet-send-batch" type="button" disabled>提交批量任务</button>
      </details>
      <div class="panel-body ruled actions"><p id="fleet-result" role="status">等待仿真调度就绪</p><a class="button" href="/fleet">查看运行地图</a></div>
    </article>
