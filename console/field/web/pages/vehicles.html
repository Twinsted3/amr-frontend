<article class="panel">
      <div class="panel-head"><h2>车队与设备</h2></div>
      <div id="registered-vehicles"></div>
    </article>
    <article class="panel recent">
      <div class="panel-head"><h2>添加叉车</h2></div>

      <form id="vehicle-add" class="panel-body form-line">
        <label>车辆编号<input id="new-vehicle-id" maxlength="120" required></label>
        <label>显示名称<input id="new-vehicle-name" maxlength="120" required></label>
        <label>车辆 IPv4<input id="new-vehicle-host" required></label>
        <label>车况端口<input id="new-vehicle-port" type="number" min="1" max="65535" value="19301" required></label>
        <button type="submit" class="primary">添加叉车</button>
      </form>
    </article>
