<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打开AMR调度控制台</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f2f5fa;color:#172540;font:16px/1.7 "Microsoft YaHei","Segoe UI",sans-serif}
main{width:min(620px,100%);padding:36px;background:white;border:1px solid #dce4f0;border-radius:16px;box-shadow:0 18px 54px #14264a15}
.badge{display:inline-block;padding:3px 11px;border-radius:100px;background:#e9efff;color:#2348b2;font-size:13px;font-weight:700}
h1{margin:12px 0 8px;font-size:27px}p{margin:8px 0;color:#4c5d78}code{color:#244590}a{display:inline-flex;margin-top:14px;padding:9px 16px;border-radius:8px;background:#2356e8;color:white;text-decoration:none;font-weight:700}a:focus-visible{outline:3px solid #244590;outline-offset:4px}
</style>
</head>
<body>
<main>
<span class="badge">AMR调度</span>
<h1>请从本地服务打开控制台</h1>
<p>当前打开的是本地文件。地图、任务和车辆状态需要由控制台服务提供。</p>
<p>在项目目录双击 <strong>启动控制台.cmd</strong>。控制台服务启动后会自动打开浏览器。</p>
<a href="http://127.0.0.1:8081/">访问已启动的控制台</a>
<p>使用自定义端口时，请打开启动窗口显示的地址。</p>
</main>
</body>
</html>
