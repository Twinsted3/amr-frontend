amcl:
  ros__parameters:
    alpha1: 0.005
    alpha2: 0.005
    alpha3: 0.005
    alpha4: 0.005
    alpha5: 0.005
    base_frame_id: agv10_base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 120
    max_particles: 1200
    min_particles: 300
    odom_frame_id: agv10_odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    service_introspection_mode: disabled
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    scan_topic: scan_mapping
    set_initial_pose: true
    initial_pose:
      x: 53.0
      y: 49.0
      z: 0.0
      yaw: -1.5707963267948966
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: agv10_base_footprint
    odom_topic: odom
    bt_loop_duration: 10
    filter_duration: 0.3
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    service_introspection_mode: disabled
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
      enable_groot_monitoring: false
      groot_server_port: 1667
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
      enable_groot_monitoring: false
      groot_server_port: 1669
    bt_search_directories:
    - $(find-pkg-share nav2_bt_navigator)/behavior_trees
    error_code_name_prefixes:
    - assisted_teleop
    - backup
    - compute_path
    - dock_robot
    - drive_on_heading
    - follow_path
    - nav_thru_poses
    - nav_to_pose
    - route
    - spin
    - smoother
    - undock_robot
    - wait
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    use_realtime_priority: false
    speed_limit_topic: speed_limit
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 25.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.6
      lookahead_dist: 0.65
      min_lookahead_dist: 0.45
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.2
    enable_stamped_cmd_vel: false
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: agv10_odom
      robot_base_frame: agv10_base_footprint
      rolling_window: true
      width: 7
      height: 7
      resolution: 0.05
      plugins:
      - obstacle_layer
      - inflation_layer
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: KEEPOUT_ZONE_ENABLED
        filter_info_topic: keepout_costmap_filter_info
        override_lethal_cost: true
        lethal_override_cost: 200
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.0
        inflation_radius: 0.85
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      always_send_full_costmap: true
      service_introspection_mode: disabled
      footprint: '[[-1.62, -0.58], [0.28, -0.58], [0.28, 0.58], [-1.62, 0.58]]'
      initial_transform_timeout: 10.0
      transform_tolerance: 0.5
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan scan_low scan_mapping
        scan:
          topic: scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 3.0
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0
        scan_low:
          topic: scan_low
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 1.0
          raytrace_max_range: 8.0
          raytrace_min_range: 0.08
          obstacle_max_range: 7.0
          obstacle_min_range: 0.08
        scan_mapping:
          topic: scan_mapping
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 1.5
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: agv10_base_footprint
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: KEEPOUT_ZONE_ENABLED
        filter_info_topic: keepout_costmap_filter_info
        override_lethal_cost: true
        lethal_override_cost: 200
      speed_filter:
        plugin: nav2_costmap_2d::SpeedFilter
        enabled: SPEED_ZONE_ENABLED
        filter_info_topic: speed_costmap_filter_info
        speed_limit_topic: speed_limit
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan scan_low scan_mapping
        scan:
          topic: scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 3.0
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0
        scan_low:
          topic: scan_low
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 1.0
          raytrace_max_range: 8.0
          raytrace_min_range: 0.08
          obstacle_max_range: 7.0
          obstacle_min_range: 0.08
        scan_mapping:
          topic: scan_mapping
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 1.5
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.0
        inflation_radius: 0.85
      always_send_full_costmap: true
      service_introspection_mode: disabled
      footprint: '[[-1.62, -0.58], [0.28, -0.58], [0.28, 0.58], [-1.62, 0.58]]'
      initial_transform_timeout: 10.0
      transform_tolerance: 0.5
map_server:
  ros__parameters:
    service_introspection_mode: disabled
keepout_filter_mask_server:
  ros__parameters:
    topic_name: keepout_filter_mask
keepout_costmap_filter_info_server:
  ros__parameters:
    type: 0
    filter_info_topic: keepout_costmap_filter_info
    mask_topic: keepout_filter_mask
    base: 0.0
    multiplier: 1.0
speed_filter_mask_server:
  ros__parameters:
    topic_name: speed_filter_mask
speed_costmap_filter_info_server:
  ros__parameters:
    type: 1
    filter_info_topic: speed_costmap_filter_info
    mask_topic: speed_filter_mask
    base: 100.0
    multiplier: -1.0
map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
    service_introspection_mode: disabled
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins:
    - GridBased
    costmap_update_timeout: 1.0
    service_introspection_mode: disabled
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
smoother_server:
  ros__parameters:
    smoother_plugins:
    - simple_smoother
    - route_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      refinement_num: 2
      enforce_path_inversion: true
      do_refinement: true
    route_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      refinement_num: 5
      enforce_path_inversion: false
      do_refinement: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
      acceleration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.1
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
      acceleration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.1
    wait:
      plugin: nav2_behaviors::Wait
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    local_frame: agv10_odom
    global_frame: map
    robot_base_frame: agv10_base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: false
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    service_introspection_mode: disabled
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
route_server:
  ros__parameters:
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations:
    - AdjustSpeedLimit
    - ReroutingService
    - CollisionMonitor
    ReroutingService:
      plugin: nav2_route::ReroutingService
    AdjustSpeedLimit:
      plugin: nav2_route::AdjustSpeedLimit
    CollisionMonitor:
      plugin: nav2_route::CollisionMonitor
      max_collision_dist: 3.0
    edge_cost_functions:
    - DistanceScorer
    - CostmapScorer
    DistanceScorer:
      plugin: nav2_route::DistanceScorer
    CostmapScorer:
      plugin: nav2_route::CostmapScorer
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.7
    - 0.0
    - 0.8
    min_velocity:
    - -0.25
    - 0.0
    - -0.8
    max_accel:
    - 0.5
    - 0.0
    - 1.0
    max_decel:
    - -0.5
    - 0.0
    - -1.0
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: false
collision_monitor:
  ros__parameters:
    base_frame_id: agv10_base_footprint
    odom_frame_id: agv10_odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons:
    - FootprintApproach
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources:
    - scan
    scan:
      type: scan
      topic: scan
      min_height: 0.15
      max_height: 3.0
      enabled: true
    enable_stamped_cmd_vel: false
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: agv10_base_footprint
    fixed_frame: agv10_odom
    dock_prestaging_tolerance: 0.5
    service_introspection_mode: disabled
    dock_plugins:
    - simple_charging_dock
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      dock_direction: forward
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
    enable_stamped_cmd_vel: false
loopback_simulator:
  ros__parameters:
    base_frame_id: agv10_base_footprint
    odom_frame_id: agv10_odom
    map_frame_id: map
    scan_frame_id: base_scan
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
